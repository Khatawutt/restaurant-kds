<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สั่งอาหาร - Customer Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Prompt', sans-serif; } </style>
</head>
<body class="bg-gray-100 min-h-screen p-6">

    <div class="max-w-md mx-auto bg-white rounded-xl shadow-lg p-6">
        <h2 class="text-2xl font-bold text-gray-800 mb-4">📝 ฟอร์มสั่งอาหาร (จำลอง)</h2>
        
        <!-- ช่องกรอกเลขโต๊ะ / ห้อง -->
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">โต๊ะ / ห้อง:</label>
            <input type="text" id="room" placeholder="เช่น โต๊ะ 5 หรือ ห้อง VIP 1" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500">
        </div>

        <!-- ช่องกรอกรายการอาหาร -->
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">รายการอาหาร:</label>
            <textarea id="menu" rows="3" placeholder="เช่น ข้าวผัดกุ้ง 1, น้ำอัดลม 2" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500"></textarea>
        </div>

        <!-- ช่องกรอกราคารวม -->
        <div class="mb-6">
            <label class="block text-gray-700 text-sm font-bold mb-2">ราคารวม (บาท):</label>
            <input type="number" id="price" placeholder="350" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500">
        </div>

        <!-- ปุ่มยืนยันการสั่งซื้อ (หลังโอนเงินเสร็จ) -->
        <button onclick="sendOrderToKitchen()" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 px-4 rounded-lg transition shadow-md">
            ✅ ยืนยันการชำระเงินและสั่งอาหาร
        </button>
    </div>

    <!-- ส่วนของ Script สำหรับส่งข้อมูล -->
    <script>
        // ⚠️ สำคัญ: นำ Web App URL ของ Google Apps Script มาใส่ตรงนี้
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxzGnt4q8Y8tyYGDYz6HLYuedZO1oqI4_YQzrJnAcwPrekjdaiYeZkoJkaLv1o-NOJA/exec';

        async function sendOrderToKitchen() {
            // ดึงค่าจากฟอร์มหน้าเว็บ
            const roomValue = document.getElementById('room').value.trim();
            const menuValue = document.getElementById('menu').value.trim();
            const priceValue = document.getElementById('price').value.trim();

            // ตรวจสอบว่ากรอกข้อมูลครบไหม
            if (!roomValue || !menuValue || !priceValue) {
                alert('กรุณากรอกข้อมูลให้ครบถ้วนก่อนสั่งอาหาร');
                return;
            }

            // จัดรูปแบบข้อมูลที่จะส่ง
            const orderData = {
                action: 'addNewOrder',
                room: roomValue,
                menu: menuValue,
                price: Number(priceValue)
            };

            try {
                // แสดงสถานะกำลังส่ง
                event.target.disabled = true;
                event.target.innerText = 'กำลังส่งอเดอร์เข้าครัว...';

                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(orderData),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' } // ป้องกัน CORS บน Google Apps Script
                });

                const result = await response.json();
                
                if (result.status === 'success') {
                    alert('🎉 สั่งอาหารสำเร็จ! ออเดอร์ถูกส่งเข้าห้องครัวและบันทึกเรียบร้อยแล้ว');
                    
                    // เคลียร์ฟอร์มหลังสั่งซื้อสำเร็จ
                    document.getElementById('room').value = '';
                    document.getElementById('menu').value = '';
                    document.getElementById('price').value = '';
                } else {
                    alert('เกิดข้อผิดพลาดจากระบบ: ' + result.message);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้ กรุณาลองใหม่อีกครั้ง');
            } finally {
                // คืนค่าปุ่มกด
                event.target.disabled = false;
                event.target.innerText = '✅ ยืนยันการชำระเงินและสั่งอาหาร';
            }
        }
    </script>
</body>
</html>

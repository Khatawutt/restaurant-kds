<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDS Kitchen Display System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .order-card { animation: slideDown 0.3s ease-out; }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-4 md:p-6">

    <header class="flex flex-col md:flex-row justify-between items-center bg-gray-900 p-4 rounded-xl border border-gray-800 shadow-xl mb-6">
        <div class="flex items-center gap-3">
            <span class="text-3xl">👨‍🍳</span>
            <div>
                <h1 class="text-2xl font-bold text-amber-400">หน้าจอสั่งการห้องครัว (KDS)</h1>
                <p class="text-xs text-gray-400">ระบบรับออเดอร์เรียลไทม์</p>
            </div>
        </div>

        <div class="flex items-center gap-4 mt-4 md:mt-0">
            <button id="audio-btn" onclick="enableAudio()" class="bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold py-2 px-3 rounded-lg shadow flex items-center gap-2 transition">
                <span id="audio-icon">🔔</span> <span id="audio-status">เปิดเสียงเตือน</span>
            </button>

            <button onclick="openSheet()" title="กดค้างไว้หรือคลิกขวาเพื่อเปลี่ยนลิงก์" oncontextmenu="event.preventDefault(); setSheetUrl()" class="bg-emerald-700 hover:bg-emerald-600 text-white text-xs font-semibold py-2 px-3 rounded-lg shadow flex items-center gap-2 transition">
                📊 <span>เปิด Sheets</span>
            </button>

            <div class="text-right">
                <span id="order-count" class="bg-amber-500 text-gray-950 font-bold px-3 py-1 rounded-full text-xs">ออเดอร์ค้าง: 0</span>
                <p id="last-update" class="text-[10px] text-gray-400 mt-1">อัปเดตล่าสุด: -</p>
            </div>
        </div>
    </header>

    <div id="connection-error" class="hidden bg-red-900/60 border border-red-700 text-red-100 text-sm rounded-xl p-3 mb-4"></div>

    <main id="orders-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
        <div class="col-span-full text-center py-16 text-gray-500">
            <p class="text-base">กำลังรอรับออเดอร์จากลูกค้า...</p>
        </div>
    </main>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxzGnt4q8Y8tyYGDYz6HLYuedZO1oqI4_YQzrJnAcwPrekjdaiYeZkoJkaLv1o-NOJA/exec';
        // ลิงก์ Google Sheets ที่เก็บออเดอร์ — ใส่ตรงนี้เพื่อให้ทุกเครื่องใช้ลิงก์เดียวกัน
        // ถ้าเว้นว่าง ปุ่ม "เปิด Sheets" จะถามลิงก์ครั้งแรกแล้วจำไว้ในเครื่องนั้น
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1cqtqFcxvCM_l6aZpkscfP76ndsg5RyM7Qv92-Qmb_EU/edit?gid=1306309405#gid=1306309405';
        const SHEET_URL_KEY = 'kds_sheet_url';
        let previousOrderCount = -1;
        let audioContext = null;

        function playChimeSound() {
            try {
                if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
                if (audioContext.state === 'suspended') audioContext.resume();

                const now = audioContext.currentTime;
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, now); // D5
                osc.frequency.setValueAtTime(880, now + 0.15); // A5
                
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
                
                osc.connect(gain);
                gain.connect(audioContext.destination);
                
                osc.start(now);
                osc.stop(now + 0.8);
            } catch (e) {
                console.error("Audio Error:", e);
            }
        }

        function enableAudio() {
            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
            audioContext.resume();
            playChimeSound();
            
            document.getElementById('audio-btn').className = "bg-green-600 text-white text-xs font-semibold py-2 px-3 rounded-lg shadow flex items-center gap-2";
            document.getElementById('audio-icon').innerText = '🔊';
            document.getElementById('audio-status').innerText = 'เปิดเสียงเตือนแล้ว';
        }

        function getSheetUrl() {
            if (SHEET_URL) return SHEET_URL;
            try { return localStorage.getItem(SHEET_URL_KEY) || ''; } catch (e) { return ''; }
        }

        function setSheetUrl() {
            const url = (prompt('วางลิงก์ Google Sheets ที่เก็บออเดอร์:', getSheetUrl()) || '').trim();
            if (!url) return '';
            if (!url.startsWith('https://docs.google.com/spreadsheets/')) {
                alert('ลิงก์ต้องขึ้นต้นด้วย https://docs.google.com/spreadsheets/');
                return '';
            }
            try { localStorage.setItem(SHEET_URL_KEY, url); } catch (e) {}
            return url;
        }

        function openSheet() {
            const url = getSheetUrl() || setSheetUrl();
            if (url) window.open(url, '_blank', 'noopener');
        }

        function setConnectionError(message) {
            const el = document.getElementById('connection-error');
            el.textContent = message ? `⚠️ เชื่อมต่อระบบออเดอร์ไม่ได้: ${message}` : '';
            el.classList.toggle('hidden', !message);
        }

        async function fetchOrders() {
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getOrders`);
                const text = await response.text();
                let data;
                try { data = JSON.parse(text); } catch (e) {
                    throw new Error('Apps Script ไม่ได้ตอบกลับเป็น JSON (ตรวจสิทธิ์ Deploy ต้องเป็น Anyone)');
                }

                if (data.status === 'success') {
                    setConnectionError('');
                    renderOrders(data.orders);
                } else {
                    throw new Error(data.message || 'Apps Script ตอบกลับว่าไม่สำเร็จ');
                }
            } catch (error) {
                console.error('Fetch Error:', error);
                setConnectionError(error.message);
            }
        }

        function renderOrders(orders) {
            const container = document.getElementById('orders-container');
            const pendingOrders = orders.filter(o => o.status !== 'Completed');
            
            if (previousOrderCount !== -1 && pendingOrders.length > previousOrderCount) {
                playChimeSound();
            }
            previousOrderCount = pendingOrders.length;

            document.getElementById('order-count').innerText = `ออเดอร์ค้าง: ${pendingOrders.length}`;
            document.getElementById('last-update').innerText = `อัปเดตล่าสุด: ${new Date().toLocaleTimeString('th-TH')}`;

            if (pendingOrders.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-20 text-gray-500">
                        <p class="text-3xl mb-2">✅</p>
                        <p class="text-base">ทำอาหารเสร็จครบทุกออเดอร์แล้ว</p>
                    </div>`;
                return;
            }

            container.innerHTML = pendingOrders.map((order) => `
                <div class="order-card bg-gray-900 rounded-xl p-4 border-l-4 border-amber-500 shadow-md border-t border-r border-b border-gray-800 flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-start border-b border-gray-800 pb-2 mb-3">
                            <div>
                                <span class="bg-amber-500/20 text-amber-400 font-bold px-2.5 py-1 rounded text-sm">
                                    ห้อง/โต๊ะ: ${order.room || 'ไม่ระบุ'}
                                </span>
                                <p class="text-[10px] text-gray-400 mt-2">🕒 ${order.timestamp}</p>
                            </div>
                        </div>

                        <div class="text-gray-200 text-xs leading-relaxed mb-4">
                            <p class="font-semibold text-gray-400 text-[10px] mb-1">รายการสั่งซื้อ:</p>
                            <p class="bg-gray-950 p-2.5 rounded-lg border border-gray-800">${order.menu}</p>
                        </div>
                    </div>

                    <div class="pt-2 border-t border-gray-800 flex justify-between items-center gap-2">
                        <span class="text-amber-400 font-bold text-sm">฿${order.price || '0'}</span>
                        <button onclick="updateOrderStatus(${order.rowIndex}, 'Completed')" 
                            class="bg-green-600 hover:bg-green-500 text-white font-semibold text-xs py-2 px-3 rounded-lg transition shadow flex items-center gap-1">
                            ✅ เสิร์ฟแล้ว
                        </button>
                    </div>
                </div>
            `).join('');
        }

        async function updateOrderStatus(rowIndex, newStatus) {
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'updateStatus', rowIndex: rowIndex, status: newStatus }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                fetchOrders();
            } catch (error) {
                console.error('Update Error:', error);
            }
        }

        fetchOrders();
        setInterval(fetchOrders, 5000); // ดึงข้อมูลอัปเดตทุก 5 วินาที
    </script>
</body>
</html>

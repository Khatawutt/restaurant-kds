<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDS Kitchen Display System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .order-card { animation: slideDown 0.3s ease-out; }
        #print-ticket { display: none; }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media print {
            @page { margin: 4mm; }
            body.printing-order {
                background: #fff !important;
                color: #000 !important;
                min-height: 0 !important;
                padding: 0 !important;
            }
            body.printing-order > :not(#print-ticket) { display: none !important; }
            body.printing-order #print-ticket {
                display: block !important;
                width: 100%;
                max-width: 72mm;
                margin: 0 auto;
                color: #000;
                font: 11pt/1.35 Arial, "Noto Sans Thai", sans-serif;
            }
            #print-ticket .ticket-header {
                border-bottom: 1px dashed #000;
                font-size: 15pt;
                font-weight: 700;
                margin-bottom: 3mm;
                padding-bottom: 3mm;
                text-align: center;
            }
            #print-ticket .ticket-meta {
                display: flex;
                justify-content: space-between;
                gap: 4mm;
                margin: 2mm 0;
            }
            #print-ticket .ticket-items {
                border-bottom: 1px dashed #000;
                border-top: 1px dashed #000;
                margin-top: 3mm;
                padding: 2mm 0;
            }
            #print-ticket .ticket-items ol { margin: 2mm 0; padding-left: 5mm; }
            #print-ticket .ticket-items li { margin: 1mm 0; overflow-wrap: anywhere; }
            #print-ticket .ticket-quantity { font-weight: 700; white-space: nowrap; }
            #print-ticket .ticket-note { margin-top: 3mm; text-align: center; }
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-4 md:p-6">

    <header class="flex flex-col md:flex-row justify-between items-center bg-gray-900 p-4 rounded-xl border border-gray-800 shadow-xl mb-6">
        <div class="flex items-center gap-3">
            <span class="text-3xl">👨‍🍳</span>
            <div>
                <h1 class="text-2xl font-bold text-amber-400">หน้าจอสั่งการห้องครัว (KDS)</h1>
                <p class="text-xs text-gray-400">ระบบรับออเดอร์เรียลไทม์</p>
            </div>
        </div>

        <div class="flex flex-wrap items-center justify-center gap-2 mt-4 md:mt-0">
            <button id="audio-btn" onclick="enableAudio()" class="bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold py-2 px-3 rounded-lg shadow flex items-center gap-2 transition">
                <span id="audio-icon">🔔</span> <span id="audio-status">เปิดเสียงเตือน</span>
            </button>

            <button onclick="openSheet()" title="กดค้างไว้หรือคลิกขวาเพื่อเปลี่ยนลิงก์" oncontextmenu="event.preventDefault(); setSheetUrl()" class="bg-emerald-700 hover:bg-emerald-600 text-white text-xs font-semibold py-2 px-3 rounded-lg shadow flex items-center gap-2 transition">
                📊 <span>เปิด Sheets</span>
            </button>

            <button onclick="openDailySalesSummary()" class="bg-indigo-700 hover:bg-indigo-600 text-white text-xs font-semibold py-2 px-3 rounded-lg shadow transition">
                📈 สรุปยอดวันนี้
            </button>

            <button onclick="openDailySalesSummary(true)" class="bg-purple-700 hover:bg-purple-600 text-white text-xs font-semibold py-2 px-3 rounded-lg shadow transition">
                🔒 ปิดรอบวันนี้
            </button>

            <div class="text-right">
                <span id="order-count" class="bg-amber-500 text-gray-950 font-bold px-3 py-1 rounded-full text-xs">ออเดอร์ค้าง: 0</span>
                <p id="last-update" class="text-[10px] text-gray-400 mt-1">อัปเดตล่าสุด: -</p>
            </div>
        </div>
    </header>

    <div id="connection-error" class="hidden bg-red-900/60 border border-red-700 text-red-100 text-sm rounded-xl p-3 mb-4"></div>

    <section id="daily-sales-modal" class="hidden fixed inset-0 z-50 bg-black/70 p-4 flex items-center justify-center" role="dialog" aria-modal="true" aria-labelledby="daily-sales-title">
        <div class="w-full max-w-xl max-h-[90vh] overflow-y-auto bg-gray-900 border border-gray-700 rounded-2xl shadow-2xl p-5">
            <div class="flex justify-between items-start gap-4 mb-4">
                <div>
                    <h2 id="daily-sales-title" class="text-xl font-bold text-amber-300">สรุปยอดขายรายวัน</h2>
                    <p id="daily-sales-date" class="text-sm text-gray-400 mt-1"></p>
                </div>
                <button onclick="closeDailySalesSummary()" aria-label="ปิดหน้าต่าง" class="text-gray-400 hover:text-white text-xl">✕</button>
            </div>
            <div id="daily-sales-content" class="text-sm text-gray-200">กำลังโหลดสรุปยอดขาย...</div>
            <div class="flex flex-wrap justify-end gap-2 mt-5 pt-4 border-t border-gray-800">
                <button onclick="closeDailySalesSummary()" class="bg-gray-700 hover:bg-gray-600 text-white text-xs font-semibold py-2 px-4 rounded-lg">ปิด</button>
                <button id="daily-sales-close-button" onclick="closeDailySalesDay()" class="hidden bg-purple-700 hover:bg-purple-600 disabled:bg-gray-700 disabled:text-gray-400 text-white text-xs font-semibold py-2 px-4 rounded-lg">ยืนยันปิดรอบการขาย</button>
            </div>
        </div>
    </section>

    <main id="orders-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
        <div class="col-span-full text-center py-16 text-gray-500">
            <p class="text-base">กำลังรอรับออเดอร์จากลูกค้า...</p>
        </div>
    </main>

    <section id="print-ticket" aria-hidden="true"></section>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwqT1lS6nhzEWxPLcOPvy-VU1GBuDLcd-XON3H5o1IG1PfiBdgukNV7AFyhqtSXxcDj/exec';
        // ลิงก์ Google Sheets ที่เก็บออเดอร์ — ใส่ตรงนี้เพื่อให้ทุกเครื่องใช้ลิงก์เดียวกัน
        // ถ้าเว้นว่าง ปุ่ม "เปิด Sheets" จะถามลิงก์ครั้งแรกแล้วจำไว้ในเครื่องนั้น
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1cqtqFcxvCM_l6aZpkscfP76ndsg5RyM7Qv92-Qmb_EU/edit?gid=1306309405#gid=1306309405';
        const SHEET_URL_KEY = 'kds_sheet_url';
        let previousOrderCount = -1;
        let audioContext = null;
        let pendingOrdersForPrint = [];

        function escapeHtml(value) {
            return String(value == null ? '' : value).replace(/[&<>"']/g, (char) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[char]);
        }

        function safeSlipUrl(value) {
            if (!value) return '';
            try {
                const url = new URL(String(value), window.location.href);
                return url.protocol === 'https:' && ['drive.google.com', 'docs.google.com'].includes(url.hostname)
                    ? url.href
                    : '';
            } catch (error) {
                return '';
            }
        }

        function menuItemsForDisplay(order) {
            if (Array.isArray(order.items) && order.items.length) {
                return order.items.map((item) => {
                    const quantity = item && item.quantity !== '' && item.quantity != null
                        ? Number(item.quantity)
                        : null;
                    return {
                        name: String(item && (item.name || item.menu) || '').trim(),
                        quantity: Number.isInteger(quantity) && quantity > 0 ? quantity : null,
                        rowIndex: Number.isInteger(Number(item && item.rowIndex)) ? Number(item.rowIndex) : null,
                        status: String(item && item.status || order.status || '').trim()
                    };
                }).filter(item => item.name);
            }
            const menu = String(order.menu || '').trim();
            if (!menu) return [];

            return menu.split(/\r?\n/).flatMap((line) => {
                const matches = Array.from(line.matchAll(/([^,\n]+?\s+\(x\d+\)(?:\s+\[[^\]]*\])?)(?=,\s+|$)/g));
                const entries = matches.length ? matches.map(match => match[1].trim()) : [line.trim()];
                return entries.map((entry) => {
                    const match = entry.match(/^(.*?)\s+\(x(\d+)\)(?:\s+\[([^\]]*)\])?$/);
                    return match
                        ? { name: match[1] + (match[3] ? ` [${match[3]}]` : ''), quantity: Number(match[2]), rowIndex: null, status: order.status || '' }
                        : { name: entry, quantity: null, rowIndex: null, status: order.status || '' };
                }).filter(item => item.name);
            });
        }

        function renderMenuRows(order, orderIndex) {
            const items = menuItemsForDisplay(order);
            if (!items.length) return '<div class="text-gray-400">ไม่พบรายการ</div>';
            return items.map((item, itemIndex) => {
                const itemStatus = String(item.status || order.status || '').toLowerCase();
                const cancelled = itemStatus === 'cancelled';
                const canCancelItem = !cancelled && itemStatus === 'pending'
                    && Number.isInteger(item.rowIndex) && item.rowIndex >= 2;
                return `
                <div class="menu-item-row flex items-center justify-between gap-3 border-b border-gray-800 last:border-0 py-2 ${cancelled ? 'text-gray-500' : ''}">
                    <span class="min-w-0 flex-1 break-words ${cancelled ? 'line-through' : ''}">
                        ${escapeHtml(item.name)}
                        ${cancelled ? '<small class="ml-1 text-red-400 no-underline">ยกเลิกแล้ว</small>' : ''}
                    </span>
                    <div class="flex shrink-0 items-center gap-2">
                        ${item.quantity ? `<strong class="${cancelled ? 'text-gray-500' : 'text-amber-300'}">×${item.quantity}</strong>` : ''}
                        ${canCancelItem ? `<button onclick="cancelOrderItem(${orderIndex}, ${itemIndex})" title="ยกเลิกรายการนี้เท่านั้น" class="bg-red-900/80 hover:bg-red-700 text-red-100 text-[10px] font-semibold px-2 py-1 rounded">ยกเลิกรายการ</button>` : ''}
                    </div>
                </div>`;
            }).join('');
        }

        function printableItems(order) {
            return menuItemsForDisplay(order).filter(item => String(item.status || order.status || '').toLowerCase() !== 'cancelled').map(item => {
                const quantityLabel = item.quantity ? `<span class="ticket-quantity"> ×${item.quantity}</span>` : '';
                return `<li>${escapeHtml(item.name)}${quantityLabel}</li>`;
            }).join('');
        }

        function printOrder(index) {
            const order = pendingOrdersForPrint[index];
            if (!order) return;

            const orderId = String(order.orderId || '');
            const room = String(order.room || 'ไม่ระบุ');
            const timestamp = String(order.timestamp || order.time || '-');
            const name = String(order.name || '');
            const ticket = document.getElementById('print-ticket');
            const previousTitle = document.title;

            ticket.innerHTML = `
                <div class="ticket-header">BAR ORDER COPY</div>
                <div class="ticket-meta"><span>ห้อง/โต๊ะ</span><strong>${escapeHtml(room)}</strong></div>
                ${orderId ? `<div class="ticket-meta"><span>ออเดอร์</span><strong>${escapeHtml(orderId)}</strong></div>` : ''}
                <div class="ticket-meta"><span>เวลา</span><span>${escapeHtml(timestamp)}</span></div>
                ${name ? `<div class="ticket-meta"><span>ชื่อ</span><span>${escapeHtml(name)}</span></div>` : ''}
                <div class="ticket-items"><strong>รายการสั่งซื้อ</strong><ol>${printableItems(order)}</ol></div>
                <div class="ticket-note">สำเนาสำหรับ Bar</div>`;

            document.title = `BAR-${orderId || room}`;
            document.body.classList.add('printing-order');
            window.addEventListener('afterprint', () => {
                document.body.classList.remove('printing-order');
                ticket.innerHTML = '';
                document.title = previousTitle;
            }, { once: true });
            window.print();
        }

        function playChimeSound() {
            try {
                if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
                if (audioContext.state === 'suspended') audioContext.resume();

                const now = audioContext.currentTime;
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, now); // D5
                osc.frequency.setValueAtTime(880, now + 0.15); // A5
                
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
                
                osc.connect(gain);
                gain.connect(audioContext.destination);
                
                osc.start(now);
                osc.stop(now + 0.8);
            } catch (e) {
                console.error("Audio Error:", e);
            }
        }

        function enableAudio() {
            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
            audioContext.resume();
            playChimeSound();
            
            document.getElementById('audio-btn').className = "bg-green-600 text-white text-xs font-semibold py-2 px-3 rounded-lg shadow flex items-center gap-2";
            document.getElementById('audio-icon').innerText = '🔊';
            document.getElementById('audio-status').innerText = 'เปิดเสียงเตือนแล้ว';
        }

        function getSheetUrl() {
            if (SHEET_URL) return SHEET_URL;
            try { return localStorage.getItem(SHEET_URL_KEY) || ''; } catch (e) { return ''; }
        }

        function setSheetUrl() {
            const url = (prompt('วางลิงก์ Google Sheets ที่เก็บออเดอร์:', getSheetUrl()) || '').trim();
            if (!url) return '';
            if (!url.startsWith('https://docs.google.com/spreadsheets/')) {
                alert('ลิงก์ต้องขึ้นต้นด้วย https://docs.google.com/spreadsheets/');
                return '';
            }
            try { localStorage.setItem(SHEET_URL_KEY, url); } catch (e) {}
            return url;
        }

        function openSheet() {
            const url = getSheetUrl() || setSheetUrl();
            if (url) window.open(url, '_blank', 'noopener');
        }

        function setConnectionError(message) {
            const el = document.getElementById('connection-error');
            el.textContent = message ? `⚠️ เชื่อมต่อระบบออเดอร์ไม่ได้: ${message}` : '';
            el.classList.toggle('hidden', !message);
        }

        async function fetchOrders() {
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getOrders`);
                const text = await response.text();
                let data;
                try { data = JSON.parse(text); } catch (e) {
                    throw new Error('Apps Script ไม่ได้ตอบกลับเป็น JSON (ตรวจสิทธิ์ Deploy ต้องเป็น Anyone)');
                }

                if (data.status === 'success') {
                    setConnectionError('');
                    renderOrders(data.orders);
                } else {
                    throw new Error(data.message || 'Apps Script ตอบกลับว่าไม่สำเร็จ');
                }
            } catch (error) {
                console.error('Fetch Error:', error);
                setConnectionError(error.message);
            }
        }

        function renderOrders(orders) {
            const container = document.getElementById('orders-container');
            const pendingOrders = orders.filter((order) => {
                const status = String(order.status || '').trim().toLowerCase();
                return status !== 'completed' && status !== 'cancelled';
            });
            pendingOrdersForPrint = pendingOrders;
            
            if (previousOrderCount !== -1 && pendingOrders.length > previousOrderCount) {
                playChimeSound();
            }
            previousOrderCount = pendingOrders.length;

            document.getElementById('order-count').innerText = `ออเดอร์ค้าง: ${pendingOrders.length}`;
            document.getElementById('last-update').innerText = `อัปเดตล่าสุด: ${new Date().toLocaleTimeString('th-TH')}`;

            if (pendingOrders.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-20 text-gray-500">
                        <p class="text-3xl mb-2">✅</p>
                        <p class="text-base">ทำอาหารเสร็จครบทุกออเดอร์แล้ว</p>
                    </div>`;
                return;
            }

            container.innerHTML = pendingOrders.map((order, index) => {
                const slipUrl = safeSlipUrl(order.slip);
                const payment = String(order.payment || '');
                const cancelReasons = Array.isArray(order.cancelReasonOptions) ? order.cancelReasonOptions : [];
                const canCancel = order.canCancel === true && cancelReasons.length > 0;
                const paymentBadge = slipUrl
                    ? `<a href="${escapeHtml(slipUrl)}" target="_blank" rel="noopener" class="bg-sky-600/20 text-sky-300 text-[11px] font-semibold px-2 py-1 rounded whitespace-nowrap">🧾 ดูสลิป</a>`
                    : (/alipay/i.test(payment)
                        ? `<span class="bg-blue-600/20 text-blue-300 text-[11px] font-semibold px-2 py-1 rounded whitespace-nowrap">Alipay: ชำระที่ห้อง</span>`
                        : (/restaurant/i.test(payment)
                            ? `<span class="bg-amber-500/20 text-amber-300 text-[11px] font-semibold px-2 py-1 rounded whitespace-nowrap">💵 ชำระที่ร้าน (บัตร/เงินสด)</span>`
                            : (order.orderId && Object.prototype.hasOwnProperty.call(order, 'slip')
                                ? `<span class="bg-red-600/20 text-red-300 text-[11px] px-2 py-1 rounded whitespace-nowrap">ไม่มีสลิป</span>`
                                : '')));
                return `
                <div class="order-card bg-gray-900 rounded-xl p-4 border-l-4 border-amber-500 shadow-md border-t border-r border-b border-gray-800 flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-start border-b border-gray-800 pb-2 mb-3">
                            <div>
                                <span class="bg-amber-500/20 text-amber-400 font-bold px-2.5 py-1 rounded text-sm">
                                    ห้อง/โต๊ะ: ${escapeHtml(order.room || 'ไม่ระบุ')}
                                </span>
                                <p class="text-[10px] text-gray-400 mt-2">🕒 ${escapeHtml(order.timestamp || order.time || '-')}</p>
                                ${order.orderId ? `<p class="text-[10px] text-gray-500 mt-0.5"># ${escapeHtml(order.orderId)}</p>` : ''}
                            </div>
                            ${paymentBadge}
                        </div>

                        <div class="text-gray-200 text-xs leading-relaxed mb-4">
                            <p class="font-semibold text-gray-400 text-[10px] mb-1">รายการสั่งซื้อ:</p>
                            <div class="bg-gray-950 p-2.5 rounded-lg border border-gray-800">${renderMenuRows(order, index)}</div>
                        </div>
                    </div>

                    <div class="pt-2 border-t border-gray-800 flex justify-between items-center gap-2">
                        <span class="text-amber-400 font-bold text-sm">฿${escapeHtml(order.price || '0')}</span>
                        <div class="flex flex-wrap gap-2">
                            <button onclick="printOrder(${index})" title="เปิดหน้าต่างพิมพ์ แล้วเลือกเครื่อง Bar"
                                class="bg-sky-700 hover:bg-sky-600 text-white font-semibold text-xs py-2 px-3 rounded-lg transition shadow">
                                🖨 พิมพ์ Bar
                            </button>
                            ${canCancel ? `<button onclick="cancelOrder(${index})" title="ยกเลิกได้เมื่อออเดอร์ค้างเกิน 1 ชั่วโมง"
                                class="bg-red-700 hover:bg-red-600 text-white font-semibold text-xs py-2 px-3 rounded-lg transition shadow">
                                ยกเลิกเมนู
                            </button>` : ''}
                            <button onclick="updateOrderStatus(${index}, 'Completed')"
                                class="bg-green-600 hover:bg-green-500 text-white font-semibold text-xs py-2 px-3 rounded-lg transition shadow flex items-center gap-1">
                                ✅ เสิร์ฟแล้ว
                            </button>
                        </div>
                    </div>
                </div>
            `}).join('');
        }

        async function updateOrderStatus(index, newStatus, reason) {
            const order = pendingOrdersForPrint[index];
            if (!order) return;

            const payload = {
                action: 'updateStatus',
                status: newStatus,
                rowIndex: Number(order.rowIndex) || undefined,
                orderId: String(order.orderId || '')
            };
            if (reason) payload.reason = reason;

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                const text = await response.text();
                let result;
                try {
                    result = JSON.parse(text);
                } catch (error) {
                    throw new Error('ระบบออเดอร์ไม่ได้ตอบกลับเป็น JSON');
                }
                if (!response.ok || result.status !== 'success') {
                    throw new Error(result.message || 'อัปเดตสถานะออเดอร์ไม่สำเร็จ');
                }
                await fetchOrders();
            } catch (error) {
                console.error('Update Error:', error);
                setConnectionError(error.message);
            }
        }

        async function cancelOrderItem(orderIndex, itemIndex) {
            const order = pendingOrdersForPrint[orderIndex];
            const item = order && menuItemsForDisplay(order)[itemIndex];
            if (!order || !item || item.status.toLowerCase() !== 'pending'
                || !Number.isInteger(item.rowIndex) || item.rowIndex < 2) return;

            const details = [
                `ห้อง/โต๊ะ: ${order.room || 'ไม่ระบุ'}`,
                order.orderId ? `ออเดอร์: ${order.orderId}` : '',
                `รายการ: ${item.name}${item.quantity ? ` ×${item.quantity}` : ''}`
            ].filter(Boolean).join('\n');
            if (!window.confirm(`ยืนยันยกเลิกรายการนี้เท่านั้นหรือไม่?\n\n${details}`)) return;
            const token = window.prompt('กรอกรหัสพนักงาน KDS เพื่อยืนยันการยกเลิกรายการ:');
            if (!token) return;

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'cancelItem',
                        orderId: String(order.orderId || ''),
                        rowIndex: item.rowIndex,
                        token: String(token).trim()
                    }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                const text = await response.text();
                let result;
                try {
                    result = JSON.parse(text);
                } catch (error) {
                    throw new Error('ระบบออเดอร์ไม่ได้ตอบกลับเป็น JSON');
                }
                if (!response.ok || result.status !== 'success') {
                    throw new Error(result.message || 'ยกเลิกรายการไม่สำเร็จ');
                }
                await fetchOrders();
            } catch (error) {
                console.error('Cancel Item Error:', error);
                setConnectionError(error.message);
            }
        }

        function cancelOrder(index) {
            const order = pendingOrdersForPrint[index];
            if (!order || order.canCancel !== true) return;

            const reasons = Array.isArray(order.cancelReasonOptions) ? order.cancelReasonOptions : [];
            const reason = String(reasons[0] || '').trim();
            if (!reason) {
                setConnectionError('ระบบออเดอร์ไม่ได้ระบุเหตุผลที่ใช้ยกเลิก');
                return;
            }

            const details = [
                `ห้อง: ${order.room || 'ไม่ระบุ'}`,
                order.orderId ? `ออเดอร์: ${order.orderId}` : '',
                `รายการ: ${order.menu || 'ไม่ระบุ'}`,
                `เหตุผล: ${reason}`
            ].filter(Boolean).join('\n');
            if (!window.confirm(`ยืนยันยกเลิกเมนูทั้งออเดอร์นี้หรือไม่?\n\n${details}`)) return;
            return updateOrderStatus(index, 'Cancelled', reason);
        }

        function todayDateKey() {
            const parts = new Intl.DateTimeFormat('en-CA', {
                timeZone: 'Asia/Bangkok',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            }).formatToParts(new Date());
            const part = type => parts.find(value => value.type === type).value;
            return `${part('year')}-${part('month')}-${part('day')}`;
        }

        function openDailySalesSummary(closeAfterReview) {
            const modal = document.getElementById('daily-sales-modal');
            modal.classList.remove('hidden');
            document.getElementById('daily-sales-date').innerText = `วันที่ ${todayDateKey()} (เวลาไทย)`;
            document.getElementById('daily-sales-content').innerText = 'กำลังโหลดสรุปยอดขาย...';
            document.getElementById('daily-sales-close-button').classList.add('hidden');
            fetchDailySalesSummary(todayDateKey(), closeAfterReview === true);
        }

        function closeDailySalesSummary() {
            document.getElementById('daily-sales-modal').classList.add('hidden');
        }

        function formatBaht(value) {
            const amount = Number(value);
            return `฿${Number.isFinite(amount) ? amount.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '0.00'}`;
        }

        function renderDailySalesSummary(summary, closeAfterReview) {
            const payments = Object.entries(summary.paymentTotals || {})
                .sort((a, b) => a[0].localeCompare(b[0], 'th'));
            const paymentRows = payments.length
                ? payments.map(([method, total]) => `
                    <div class="flex justify-between gap-4 py-1 border-b border-gray-800">
                        <span class="break-words">${escapeHtml(method)}</span>
                        <strong class="shrink-0">${formatBaht(total)}</strong>
                    </div>`).join('')
                : '<p class="text-gray-400">ยังไม่มียอดขายที่เสิร์ฟแล้วในวันนี้</p>';
            const warnings = [];
            if (summary.pendingOrderCount) warnings.push(`ยังมี ${summary.pendingOrderCount} ออเดอร์ค้าง`);
            if (summary.ordersWithoutAmount) warnings.push(`${summary.ordersWithoutAmount} ออเดอร์ไม่มีราคาที่ถูกต้อง`);
            document.getElementById('daily-sales-content').innerHTML = `
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <div class="bg-gray-950 rounded-lg p-3"><p class="text-gray-400 text-xs">ออเดอร์เสร็จแล้ว</p><strong class="text-lg">${Number(summary.completedOrderCount) || 0}</strong></div>
                    <div class="bg-gray-950 rounded-lg p-3"><p class="text-gray-400 text-xs">ยอดขายรวม</p><strong class="text-lg text-amber-300">${formatBaht(summary.totalSales)}</strong></div>
                </div>
                <h3 class="font-semibold mb-2">แยกตามช่องทางชำระเงิน</h3>
                <div class="mb-4">${paymentRows}</div>
                <p class="text-xs text-gray-400">ออเดอร์ค้าง: ${Number(summary.pendingOrderCount) || 0} · ยกเลิกทั้งออเดอร์: ${Number(summary.cancelledOrderCount) || 0}</p>
                ${summary.closed
                    ? `<p class="mt-3 rounded-lg bg-green-900/40 border border-green-800 p-3 text-green-200">ปิดรอบแล้ว${summary.closedAt ? ` เมื่อ ${escapeHtml(summary.closedAt)}` : ''} ยอดนี้เป็น snapshot ตอนปิดรอบ</p>`
                    : `<p class="mt-3 text-xs text-gray-400">สรุปยอดเฉพาะออเดอร์ที่เสิร์ฟแล้ว ไม่รวมออเดอร์ที่ยกเลิก ยอดเป็นยอดรวมระดับออเดอร์ การยกเลิกรายการย่อยไม่ปรับยอดหรือคืนเงินอัตโนมัติ</p>`}
                ${warnings.length ? `<p class="mt-3 rounded-lg bg-red-900/40 border border-red-800 p-3 text-red-200">${escapeHtml(warnings.join(' · '))}</p>` : ''}
            `;
            const closeButton = document.getElementById('daily-sales-close-button');
            closeButton.classList.toggle('hidden', !!summary.closed || closeAfterReview !== true);
            closeButton.disabled = Number(summary.pendingOrderCount) > 0 || Number(summary.ordersWithoutAmount) > 0;
        }

        async function fetchDailySalesSummary(date, closeAfterReview) {
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getDailySalesSummary&date=${encodeURIComponent(date)}`);
                const text = await response.text();
                let result;
                try {
                    result = JSON.parse(text);
                } catch (error) {
                    throw new Error('ระบบออเดอร์ไม่ได้ตอบกลับเป็น JSON');
                }
                if (!response.ok || result.status !== 'success' || !result.summary) {
                    throw new Error(result.message || 'โหลดสรุปยอดขายไม่สำเร็จ');
                }
                renderDailySalesSummary(result.summary, closeAfterReview);
            } catch (error) {
                console.error('Daily Sales Summary Error:', error);
                document.getElementById('daily-sales-content').innerText = `โหลดสรุปยอดขายไม่สำเร็จ: ${error.message}`;
                document.getElementById('daily-sales-close-button').classList.add('hidden');
            }
        }

        async function closeDailySalesDay() {
            const date = todayDateKey();
            if (!window.confirm(`ยืนยันปิดรอบการขายวันที่ ${date} หรือไม่?\n\nระบบจะบันทึกยอดสรุปเป็น snapshot และไม่รับออเดอร์ใหม่ของวันนี้`)) return;
            const token = window.prompt('กรอกรหัสพนักงาน KDS เพื่อยืนยันการปิดรอบ:');
            if (!token) return;
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'closeDailySales', date: date, token: String(token).trim() }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                const text = await response.text();
                let result;
                try {
                    result = JSON.parse(text);
                } catch (error) {
                    throw new Error('ระบบออเดอร์ไม่ได้ตอบกลับเป็น JSON');
                }
                if (!response.ok || result.status !== 'success' || !result.summary) {
                    throw new Error(result.message || 'ปิดรอบการขายไม่สำเร็จ');
                }
                renderDailySalesSummary(result.summary, false);
            } catch (error) {
                console.error('Close Daily Sales Error:', error);
                document.getElementById('daily-sales-content').innerText = `ปิดรอบการขายไม่สำเร็จ: ${error.message}`;
                document.getElementById('daily-sales-close-button').classList.add('hidden');
            }
        }

        fetchOrders();
        setInterval(fetchOrders, 5000); // ดึงข้อมูลอัปเดตทุก 5 วินาที
    </script>
</body>
</html>

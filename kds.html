<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDS - Kitchen Display System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-6">

    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
            <div>
                <h1 class="text-3xl font-bold tracking-wide text-amber-500">🍳 Kitchen Display System (KDS)</h1>
                <p class="text-gray-400 text-sm mt-1">ระบบแสดงรายการอาหารและเครื่องดื่มสำหรับห้องครัว</p>
            </div>
            <div class="flex items-center gap-4">
                <span id="status-indicator" class="px-3 py-1 bg-emerald-900/50 text-emerald-400 border border-emerald-700 text-xs rounded-full animate-pulse">● เชื่อมต่อแล้ว</span>
                <button onclick="loadOrders()" class="bg-gray-800 hover:bg-gray-700 text-gray-200 px-4 py-2 rounded-lg text-sm font-medium transition border border-gray-700">
                    🔄 รีเฟรชข้อมูล
                </button>
            </div>
        </header>

        <!-- Orders Container -->
        <div id="orders-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-20 text-gray-500">
                กำลังโหลดรายการอเดอร์...
            </div>
        </div>
    </div>

    <script>
        // ⚠️ นำ URL จาก Google Apps Script (Web App URL) มาใส่แทนที่ข้อความนี้
        const SCRIPT_URL = 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL';

        // โหลดข้อมูลอเดอร์อัตโนมัติทุกๆ 10 วินาที
        setInterval(loadOrders, 10000);
        window.onload = loadOrders;

        async function loadOrders() {
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getOrders`);
                const result = await response.json();
                
                if (result.status === 'success') {
                    renderOrders(result.data);
                }
            } catch (error) {
                console.error('Error fetching orders:', error);
                document.getElementById('status-indicator').className = 'px-3 py-1 bg-rose-900/50 text-rose-400 border border-rose-700 text-xs rounded-full';
                document.getElementById('status-indicator').innerText = '● ขาดการเชื่อมต่อ';
            }
        }

        function renderOrders(orders) {
            const container = document.getElementById('orders-container');
            if (!orders || orders.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-20 text-gray-500">ไม่มีอเดอร์ค้างในขณะนี้</div>`;
                return;
            }

            container.innerHTML = orders.map((order, index) => `
                <div class="bg-gray-800 border ${order.status === 'Ready' ? 'border-emerald-600/50' : 'border-gray-700'} rounded-xl p-5 shadow-xl flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <span class="text-xs text-gray-400 uppercase tracking-wider">โต๊ะ / ห้อง</span>
                                <h3 class="text-2xl font-bold text-white">${order.room}</h3>
                            </div>
                            <span class="px-3 py-1 text-xs font-semibold rounded-full ${
                                order.status === 'Pending' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' :
                                order.status === 'Cooking' ? 'bg-blue-500/20 text-blue-400 border border-blue-500/30' :
                                'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'
                            }">${order.status}</span>
                        </div>
                        
                        <div class="bg-gray-900/60 rounded-lg p-3 mb-4 border border-gray-800">
                            <p class="text-sm text-gray-300 whitespace-pre-line">${order.menu}</p>
                        </div>
                    </div>

                    <div class="flex justify-between items-center pt-3 border-t border-gray-700/50 text-xs text-gray-400">
                        <span>เวลา: ${new Date(order.timestamp).toLocaleTimeString('th-TH')}</span>
                        <div class="flex gap-2">
                            ${order.status === 'Pending' ? `<button onclick="updateStatus(${index}, 'Cooking')" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded font-medium transition">กำลังทำ</button>` : ''}
                            ${order.status !== 'Completed' ? `<button onclick="updateStatus(${index}, 'Completed')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded font-medium transition">เสร็จสิ้น</button>` : `<span class="text-emerald-400 font-medium">✓ เสร็จแล้ว</span>`}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function updateStatus(orderIndex, newStatus) {
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'updateStatus', index: orderIndex, status: newStatus }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                const result = await response.json();
                if (result.status === 'success') {
                    loadOrders();
                }
            } catch (error) {
                console.error('Error updating status:', error);
                alert('ไม่สามารถอัปเดตสถานะได้');
            }
        }
    </script>
</body>
</html>
